name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v7.0.1; reviewed Node 24 runtime
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0; reviewed Node 24 runtime
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov-report=xml
      - run: python -m pip_audit --strict --disable-pip --require-hashes -r requirements-runtime.lock --progress-spinner off
      - run: python -m pip_audit --strict --disable-pip --no-deps -r requirements-dev.lock --progress-spinner off
      - run: python tools/performance_sanity.py
      - run: surfdiff validate examples/hello.jsonl
      - run: surfdiff validate examples/hello.jsonl --format json
      - run: surfdiff snapshot examples/hello.jsonl --out "${{ runner.temp }}/surfdiff-baseline.json"
      - run: surfdiff check examples/hello.jsonl --baseline "${{ runner.temp }}/surfdiff-baseline.json" --format json
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
      - run: python -m pip download --only-binary=:all: --require-hashes -r requirements-runtime.lock -r requirements-build.lock --dest .tmp/wheelhouse
      - run: python tools/verify_artifacts.py --wheel dist/a2ui_surface_diff-0.1.0-py3-none-any.whl --sdist dist/a2ui_surface_diff-0.1.0.tar.gz --wheelhouse .tmp/wheelhouse
