name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" "hatchling>=1.27,<2"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pytest --cov-report=xml
      - run: surfdiff validate examples/hello.jsonl
      - run: surfdiff validate examples/hello.jsonl --format json
      - run: surfdiff snapshot examples/hello.jsonl --out "${{ runner.temp }}/surfdiff-baseline.json"
      - run: surfdiff check examples/hello.jsonl --baseline "${{ runner.temp }}/surfdiff-baseline.json" --format json
      - run: python -m build --no-isolation
      - run: python -m twine check dist/*
